services:
  db:
    image: postgres:15-alpine
    container_name: bookbuddy_db
    restart: always
    env_file:
      - .env-docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5
 

  app:
    build: .
    container_name: bookbuddy_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env-docker
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # Mounts local code for live reloading during development

volumes:
  postgres_data: